<!--
  Source de public/og-image.png (aperçu de partage — réseaux sociaux, WhatsApp).
  Reprend fidèlement le design de la landing page (fond blanc, thème
  « ink-neutral », boutons pilule) — pas de fond sombre ni d'accent vert.

  FONT_500/600/700/800 sont des marqueurs à remplacer par les polices Poppins
  encodées en base64 avant capture (ce fichier n'affiche pas le bon texte tel
  quel, faute de police). Pour régénérer :

    1. Récupérer les 4 fichiers .ttf Poppins (poids 500/600/700/800) depuis
       https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800
    2. Remplacer chaque FONT_<poids> par "data:font/ttf;base64,<contenu>"
    3. Capturer ce HTML en 1200×630 (device scale 1) avec un navigateur headless
       et enregistrer le résultat dans public/og-image.png
-->
<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Poppins";
    font-weight: 500;
    src: url("FONT_500") format("truetype");
  }
  @font-face {
    font-family: "Poppins";
    font-weight: 600;
    src: url("FONT_600") format("truetype");
  }
  @font-face {
    font-family: "Poppins";
    font-weight: 700;
    src: url("FONT_700") format("truetype");
  }
  @font-face {
    font-family: "Poppins";
    font-weight: 800;
    src: url("FONT_800") format("truetype");
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    background: #ffffff;
    font-family: "Poppins", sans-serif;
    position: relative;
    overflow: hidden;
  }

  .logo {
    position: absolute;
    top: 56px;
    left: 76px;
    display: flex;
    align-items: center;
    gap: 11px;
  }
  .logo-mark {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: #0f343e;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-word {
    font-weight: 700;
    font-size: 23px;
    color: #171717;
    letter-spacing: -0.02em;
  }

  .content {
    position: relative;
    height: 100%;
    padding: 0 76px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  h1 {
    font-weight: 600;
    font-size: 66px;
    line-height: 0.99;
    letter-spacing: -0.045em;
    color: #171717;
    max-width: 980px;
  }
  h1 .soft {
    color: rgba(23,23,23,0.35);
  }

  p.sub {
    margin-top: 26px;
    font-weight: 500;
    font-size: 21px;
    line-height: 1.55;
    color: #666666;
    max-width: 620px;
  }

  .buttons {
    margin-top: 40px;
    display: flex;
    gap: 12px;
  }
  .btn {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 15px 30px;
    border-radius: 13px;
    font-weight: 600;
    font-size: 19px;
  }
  .btn-solid {
    background: #171717;
    color: #ffffff;
  }
  .btn-flat {
    background: #f5f5f5;
    color: #171717;
  }

  .domain {
    position: absolute;
    right: 40px;
    bottom: 28px;
    font-weight: 500;
    font-size: 15px;
    letter-spacing: -0.01em;
    color: rgba(23,23,23,0.28);
  }
</style>
</head>
<body>
  <div class="logo">
    <span class="logo-mark">
      <svg viewBox="0 0 32 32" width="26" height="26">
        <circle cx="12.5" cy="16" r="4.6" fill="none" stroke="#29998e" stroke-width="2.6" />
        <circle cx="20.5" cy="16" r="4.6" fill="none" stroke="#ffffff" stroke-width="2.6" />
      </svg>
    </span>
    <span class="logo-word">Ooble</span>
  </div>

  <div class="domain">ooble.ca</div>

  <div class="content">
    <h1>Achetez et vendez<br />des USDT <span class="soft">en&nbsp;dollars</span></h1>
    <p class="sub">Réglé directement vers votre wallet ou votre compte Interac. Ooble ne conserve aucun solde.</p>
    <div class="buttons">
      <span class="btn btn-solid">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></svg>
        Acheter
      </span>
      <span class="btn btn-flat">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 15h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 17"/><path d="m7 21 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9"/><path d="m2 16 6 6"/><circle cx="16" cy="9" r="2.9"/></svg>
        Vendre
      </span>
    </div>
  </div>
</body>
</html>
